name: Deploy Dockerhub

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Package
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t chichia/devip:latest .

      - name: Push Docker image to Docker Hub
        run: docker push chichia/devip:latest

      - name: Deploy to AWS EC2 and Setup Database
        env:
          PRIVATE_KEY: ${{ secrets.AWS_PEM }}
          INSTANCE_IP: ${{ secrets.AWS_IP_ADDRESS }}
        run: |
          echo "$PRIVATE_KEY" > aws_pem.pem
          chmod 600 aws_pem.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts

          # SSH into the instance
          ssh -i aws_pem.pem ubuntu@$INSTANCE_IP << 'EOF'
            # Install Docker if not installed
            if ! command -v docker &> /dev/null; then
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Install PostgreSQL (or MySQL) if not installed
            if ! command -v psql &> /dev/null; then
              sudo apt install -y postgresql postgresql-contrib
              sudo systemctl start postgresql
              sudo systemctl enable postgresql

              # Create a new database and user
              sudo -u postgres psql -c "CREATE DATABASE dev_clo;"
              sudo -u postgres psql -c "CREATE USER dev_user WITH PASSWORD 'chiapassword';"
              sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE dev_clo TO dev_user;"
            fi

            # Pull and run the Docker container
            sudo docker pull chichia/devip:latest

            # Run the container, passing database connection info as environment variables
            sudo docker run -d -p 8086:8086 --name devip \
              -e DB_HOST=localhost \
              -e DB_PORT=5432 \
              -e DB_NAME=dev_clo \
              -e DB_USER=dev_user \
              -e DB_PASSWORD=chiapassword \
              chichia/devip:latest
          EOF

