name: Deploy Dockerhub

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Package
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t chichia/devip:latest .

      - name: Push Docker image to Docker Hub
        run: docker push chichia/devip:latest

      - name: Deploy to AWS EC2
        env:
          PRIVATE_KEY: ${{ secrets.AWS_PEM }}
          INSTANCE_IP: ${{ secrets.AWS_IP_ADDRESS }}
        run: |
          # Save private key and set permissions
          echo "$PRIVATE_KEY" > aws_pem.pem
          chmod 600 aws_pem.pem

          # Ensure known hosts include the target instance
          mkdir -p ~/.ssh
          ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts

          # SSH into EC2 instance and deploy Docker containers
          ssh -o StrictHostKeyChecking=no -i aws_pem.pem ubuntu@$INSTANCE_IP << 'EOF'

          # Install Docker if not already installed
          if ! command -v docker &> /dev/null; then
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
          fi

          # Create Docker network if it doesn't exist
          if ! docker network ls | grep -q cloud_network; then
            sudo docker network create cloud_network
          fi

          # Stop and remove any existing application container
          if [ "$(docker ps -aq -f name=devip)" ]; then
            sudo docker stop devip
            sudo docker rm -f devip
          fi

          # Stop and remove any existing PostgreSQL container
          if [ "$(docker ps -aq -f name=dev_user_postgres)" ]; then
            sudo docker stop dev_user_postgres
            sudo docker rm dev_user_postgres
          fi

          # Pull and run PostgreSQL container without port binding
          sudo docker run -d --name dev_user_postgres \
            --network cloud_network \
            -e POSTGRES_DB=dev_clo \
            -e POSTGRES_USER=dev_user \
            -e POSTGRES_PASSWORD=chichia \
            postgres:latest

          # Pull the latest application image
          sudo docker pull chichia/devip:latest

          # Run the application container, connecting to the PostgreSQL container
          sudo docker run -d -p 8086:8086 --name devip \
            --network cloud_network \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://dev_user_postgres:5432/dev_clo \
            -e SPRING_DATASOURCE_USERNAME=dev_user \
            -e SPRING_DATASOURCE_PASSWORD=chichia \
            chichia/devip:latest
          EOF
